name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.6.8"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Validate and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Validate tag and project version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$RELEASE_TAG is not a v<major>.<minor>.<patch> release tag"; exit 1 ;;
          esac
          version="${RELEASE_TAG#v}"
          project_version=$(sed -n 's#.*<Version>\([^<]*\)</Version>.*#\1#p' src/Microsandbox/Microsandbox.csproj)
          if [ "$version" != "$project_version" ]; then
            echo "::error::tag version $version does not match project version $project_version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Download, checksum, and stage upstream FFI assets
        run: scripts/download-native.sh "${{ steps.version.outputs.value }}"
      - run: dotnet restore Microsandbox.slnx
      - run: dotnet build Microsandbox.slnx --no-restore --configuration Release
      - name: Test managed SDK and downloaded native ABI
        env:
          MICROSANDBOX_FFI_LIBRARY: ${{ github.workspace }}/src/Microsandbox/runtimes/linux-x64/native/libmicrosandbox_go_ffi.so
        run: dotnet test Microsandbox.slnx --no-build --no-restore --configuration Release
      - name: Pack and verify release package
        run: |
          dotnet pack src/Microsandbox/Microsandbox.csproj --no-build --no-restore --configuration Release --output artifacts
          scripts/verify-package.sh "artifacts/AICD.Microsandbox.${{ steps.version.outputs.value }}.nupkg" release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish NuGet package
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/AICD.Microsandbox
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-package
          path: artifacts
      - name: Log in to NuGet.org with OIDC
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet.org
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
