name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed:
    name: Managed SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Microsandbox.slnx
      - run: dotnet build Microsandbox.slnx --no-restore
      - run: dotnet test Microsandbox.slnx --no-build --no-restore
      - name: Build examples
        run: for example in examples/*.cs; do dotnet build "$example"; done
      - name: Pack and verify managed-only package
        run: |
          dotnet pack src/Microsandbox/Microsandbox.csproj --no-restore --configuration Release --output artifacts -p:IncludeNativeAssets=false -p:RequireNativeAssets=false
          scripts/verify-package.sh artifacts/Withakay.Microsandbox.*.nupkg managed

  native-abi:
    name: Native ABI (upstream package release)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Microsandbox.slnx
      - run: dotnet build Microsandbox.slnx --no-restore
      - name: Download and validate upstream FFI assets
        run: scripts/download-native.sh
      - name: Test downloaded current-platform ABI
        env:
          MICROSANDBOX_FFI_LIBRARY: ${{ github.workspace }}/src/Microsandbox/runtimes/linux-x64/native/libmicrosandbox_go_ffi.so
        run: dotnet test Microsandbox.slnx --no-build --no-restore
