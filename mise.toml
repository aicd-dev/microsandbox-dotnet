[tools]
dotnet = "10"

[tasks.restore]
description = "Restore .NET SDK dependencies"
run = "dotnet restore Microsandbox.slnx"

[tasks.build]
description = "Build the .NET SDK"
depends = ["restore"]
run = "dotnet build Microsandbox.slnx --no-restore"

[tasks.test]
description = "Run the TUnit test suite"
depends = ["build"]
run = "dotnet test Microsandbox.slnx --no-build --no-restore"

[tasks.examples-build]
description = "Build all .NET 10 file-based app examples"
depends = ["build"]
run = '''
for example in examples/*.cs; do
  dotnet build "$example"
done
'''

[tasks.runtime-download]
description = "Download the latest release runtime for local examples"
run = "dotnet run --file scripts/download-runtime.cs"

[tasks.pack-local]
description = "Create a managed-only local NuGet package"
depends = ["restore"]
run = "dotnet pack src/Microsandbox/Microsandbox.csproj --no-restore --output artifacts -p:IncludeNativeAssets=false -p:RequireNativeAssets=false"

[tasks.pack]
description = "Alias for pack-local"
depends = ["pack-local"]

[tasks.native-download]
description = "Download, verify, and stage all five upstream FFI release assets"
run = "./scripts/download-native.sh"

[tasks.pack-release]
description = "Create a NuGet package containing all supported native RID assets"
depends = ["restore"]
run = "dotnet pack src/Microsandbox/Microsandbox.csproj --no-restore --configuration Release --output artifacts -p:IncludeNativeAssets=true -p:RequireNativeAssets=true"

[tasks.inspect]
description = "List the contents of the newest local NuGet package"
run = '''
package=$(ls -t artifacts/*.nupkg 2>/dev/null | head -n 1)
test -n "$package" || { echo "no package found under artifacts" >&2; exit 1; }
unzip -l "$package"
'''

[tasks.native-test]
description = "Download the release FFI assets and verify the current-platform ABI through .NET"
depends = ["native-download", "build"]
run = '''
case "$(uname -s)-$(uname -m)" in
  Darwin-arm64) library="$PWD/src/Microsandbox/runtimes/osx-arm64/native/libmicrosandbox_go_ffi.dylib" ;;
  Linux-x86_64) library="$PWD/src/Microsandbox/runtimes/linux-x64/native/libmicrosandbox_go_ffi.so" ;;
  Linux-aarch64|Linux-arm64) library="$PWD/src/Microsandbox/runtimes/linux-arm64/native/libmicrosandbox_go_ffi.so" ;;
  *) echo "native-test supports macOS arm64 and Linux x64/arm64" >&2; exit 1 ;;
esac
MICROSANDBOX_FFI_LIBRARY="$library" dotnet test Microsandbox.slnx --no-build --no-restore
'''

[tasks.check]
description = "Build and test the .NET SDK"
depends = ["test", "examples-build"]
